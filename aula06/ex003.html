<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Programa</title>
    <style>
        body { 
            background-color: rgb(10, 10, 44);
            color: white;
            font: 20pt arial;
        }
    </style>
</head>
<body>
    <h1>Ola, mundo!</h1>
    <p>Ja me Livrei da Maldição!!</p>

    
    <script>
        var n1 = Number.parseFloat(window.prompt("Digite um numero: "))
        var n2 = Number.parseFloat(window.prompt("Digite outro numero: "))       
        var s = n1 + n2
        window.alert(`A soma de ${n1} + ${n2} é igual a ${s}`) // usando a crase voce consegue uar o template string para concatenar 
    </script>
</body>
</html>
