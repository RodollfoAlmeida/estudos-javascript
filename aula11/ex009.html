<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="ex008.js"></script>
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res"> 

    </div>

    <script>
    function calcular()  {
    var velocidade = window.document.getElementById('txtvel')
    var res = window.document.getElementById('res')
    var vel = Number(velocidade.value)
    
    if (vel < 60) {
        res.innerHTML = `Sua velocidade atual é de ${vel} Km/h. Boa viagem`
    } else {
         res.innerHTML = `Sua velocidade atual é de ${vel} Km/h. Voce sera multado`
    }
    }




    </script>
</body>
</html>
