<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Numeros</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <H1>Analisador de Numeros</H1>
        <section>
            <div>
                <p id="num">Número (Entre 1 e 100): 
                    <input type="number" name="txtnum" id="txtnum">  
                    <input type="button" value="Adicionar" id="verificar" onclick="tabuada()">
                </p>       
            </div>
            <div id="resultado">
                <select name="analisador" id="res" size="10" >
                    <option value="numero">Digite um número acima</option>
                </select>          
            </div>
            <div>
                <input type="button" value="Finalizar" id="finalizar">   
            </div>
        </section>
        <footer>
            <p>&copy; Rodolfo Almeida</p>
        </footer> 
        <script src="script.js"></script>   
    </header>
</body>
</html>
